name: Build Android APK

on:
  push:
    branches: [ "*", "ana", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          python3-dev \
          python3-setuptools \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libltdl-dev \
          libffi-dev \
          libssl-dev

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Build with Buildozer
      run: |
        env -u ANDROID_HOME \
            -u ANDROID_SDK_ROOT \
            -u ANDROID_NDK_HOME \
            -u ANDROID_NDK \
            -u ANDROID_NDK_ROOT \
            -u ANDROID_NDK_LATEST_HOME \
            buildozer -v --debug android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nasih-APK
        path: bin/*.apk
        
